[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "llm-resume-study"
version = "0.1.0"
description = "Reproducible local name-substitution resume evaluation experiments"
requires-python = ">=3.12,<3.13"
dependencies = ["Jinja2==3.1.6", "PyYAML==6.0.3", "pydantic==2.12.3"]

[project.optional-dependencies]
transformers = ["torch==2.8.0", "transformers==4.57.1", "huggingface-hub==0.36.0"]
vllm = ["vllm==0.11.0; sys_platform == 'linux'", "torch==2.8.0", "transformers==4.57.1", "huggingface-hub==0.36.0"]
dev = ["pytest==8.4.2", "ruff==0.14.3"]

[project.scripts]
resume-study = "resume_study.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_study"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]  
